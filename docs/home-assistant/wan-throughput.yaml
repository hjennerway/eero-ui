# Append to the view's cards list; change entity IDs for your network name.
- type: glance
  title: WAN throughput
  columns: 2
  entities:
    - entity: sensor.gchq_listening_post_35x_wan_download
      name: Download · total in
      icon: mdi:download-network
    - entity: sensor.gchq_listening_post_35x_wan_upload
      name: Upload · total out
      icon: mdi:upload-network
  card_mod:
    style: "ha-card { border-radius: 18px; border: 1px solid var(--divider-color); box-shadow: none; }"
  view_layout:
    grid-area: wan
